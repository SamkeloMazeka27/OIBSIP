<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | To-Do App by Samkelo Mazeka</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <h1>TaskFlow</h1>
            <p>Organize your daily tasks</p>
        </header>

        <!-- Add Task Section -->
        <section class="add-task-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="What do you need to do?" class="task-input">
                <button id="addTaskBtn" class="add-btn">Add Task</button>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stat-card">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Total Tasks</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">Pending</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="completedCount">0</span>
                <span class="stat-label">Completed</span>
            </div>
        </section>

        <!-- Pending Tasks Section -->
        <section class="tasks-section">
            <div class="section-header">
                <h2>Pending Tasks</h2>
                <span class="section-badge" id="pendingBadge">0</span>
            </div>
            <div id="pendingTasksList" class="tasks-list">
                <div class="empty-state">
                    <p>No pending tasks</p>
                    <small>Add a new task to get started</small>
                </div>
            </div>
        </section>

        <!-- Completed Tasks Section -->
        <section class="tasks-section">
            <div class="section-header">
                <h2>Completed Tasks</h2>
                <span class="section-badge completed" id="completedBadge">0</span>
            </div>
            <div id="completedTasksList" class="tasks-list">
                <div class="empty-state">
                    <p>No completed tasks</p>
                    <small>Complete tasks to see them here</small>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Samkelo Skhanyiso Mazeka | Oasis Infobyte Internship - Level 2 Task 3</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
